<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Undernet — Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        /* AUTH PAGE */

        .auth-screen {
            position: relative;
            z-index: 1;
        }

        .auth-box {
            position: relative;
            z-index: 2;
        }
    </style>
</head>

<body class="falling-stars">

    <main class="auth-screen">

        <section class="auth-box">

            <div class="auth-content">

                <div class="auth-logo">

                    <div class="auth-symbol">
                        ✦
                    </div>

                    <h1>
                        UNDERNET
                    </h1>

                    <p class="auth-subtitle">
                        CONNECT TO THE NETWORK
                    </p>

                </div>


                <form
                    id="login-form"
                    class="auth-form"
                >

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Your password"
                        autocomplete="current-password"
                        required
                    >


                    <button type="submit">
                        LOG IN
                    </button>

                </form>


                <div class="auth-divider">
                    <span>
                        NEW TO THE NETWORK?
                    </span>
                </div>


                <div class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create one
                    </a>

                </div>

            </div>


            <div
                id="error"
                class="auth-status"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

        </section>

    </main>


    <script
        type="module"
        src="auth.js"
    ></script>

</body>

</html>
