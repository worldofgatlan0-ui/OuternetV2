<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messages - Undernet</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="falling-stars">

<div class="undernet">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">
            UNDERNET
        </div>

        <div class="top-actions">

            <button
                type="button"
                title="Search"
            >
                🔍
            </button>

            <button
                type="button"
                title="Settings"
            >
                ⚙️
            </button>

        </div>

    </header>


    <!-- SIDEBAR -->

    <nav class="nav-zone">

        <div class="menu-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nav-panel">

            <div class="nav-profile">

                <div
                    class="big-avatar"
                    id="nav-avatar"
                >
                    ?
                </div>

                <div>

                    <strong id="nav-username">
                        Loading...
                    </strong>

                    <span>
                        🟢 Online
                    </span>

                </div>

            </div>


            <div class="nav-links">

                <a
                    href="home.html"
                    class="nav-link"
                >
                    <span>🏠</span>
                    <label>Home</label>
                </a>

                <a
                    href="messages.html"
                    class="nav-link active"
                >
                    <span>💬</span>
                    <label>Messages</label>
                </a>

                <a
                    href="friends.html"
                    class="nav-link"
                >
                    <span>👥</span>
                    <label>Friends</label>
                </a>

            </div>


            <div class="nav-heading">
                SERVERS
            </div>

            <div class="server-list">

                <a
                    href="server.html?server=snowdin"
                    class="server"
                >
                    <span>❄️</span>
                    <label>Snowdin</label>
                </a>

                <a
                    href="server.html?server=waterfall"
                    class="server"
                >
                    <span>💧</span>
                    <label>Waterfall</label>
                </a>

                <a
                    href="server.html?server=hotland"
                    class="server"
                >
                    <span>🔥</span>
                    <label>Hotland</label>
                </a>

            </div>

            <button
                type="button"
                class="add-server"
            >
                ＋ Add Server
            </button>


            <div class="nav-bottom">

                <a
                    href="#"
                    class="nav-link"
                >
                    <span>🔔</span>
                    <label>Activity</label>
                </a>

                <a
                    href="#"
                    class="nav-link"
                >
                    <span>⚙️</span>
                    <label>Settings</label>
                </a>

                <button
                    type="button"
                    class="nav-link logout"
                    id="logout-button"
                >
                    <span>↪️</span>
                    <label>Log Out</label>
                </button>

            </div>

        </div>

    </nav>


    <!-- MAIN CONTENT -->

    <main class="content">

        <div class="messages-page">


            <!-- DEFAULT HEADER -->

            <div
                class="messages-header"
                id="messages-default-header"
            >

                <div class="message-user">

                    <div class="message-avatar">
                        💬
                    </div>

                    <div>

                        <h1>
                            Messages
                        </h1>

                        <span>
                            Your conversations
                        </span>

                    </div>

                </div>

            </div>


            <!-- FRIENDS / CONVERSATIONS -->

            <section class="messages-list-section">

                <h2>
                    Your Friends
                </h2>

                <div
                    id="conversation-list"
                    class="conversation-list"
                >

                    <div class="empty-box">
                        Loading friends...
                    </div>

                </div>

            </section>


            <!-- ACTIVE CHAT -->

            <div
                id="chat-view"
                style="display: none;"
            >

                <div class="messages-header">

                    <button
                        type="button"
                        class="back-button"
                        id="back-to-messages"
                    >
                        ← Messages
                    </button>

                    <div class="message-user">

                        <div
                            class="message-avatar"
                            id="message-avatar"
                        >
                            ?
                        </div>

                        <div>

                            <h1 id="message-username">
                                Loading...
                            </h1>

                            <span>
                                🟢 Online
                            </span>

                        </div>

                    </div>

                </div>


                <div
                    class="chat-area"
                    id="chat-area"
                >

                    <div class="empty-chat">

                        <div class="empty-chat-icon">
                            💬
                        </div>

                        <h2>
                            No messages yet
                        </h2>

                        <p>
                            Send a message to start the conversation!
                        </p>

                    </div>

                </div>


                <form
                    id="message-form"
                    class="message-form"
                >

                    <input
                        id="message-input"
                        name="message"
                        type="text"
                        placeholder="Type a message..."
                        maxlength="2000"
                        autocomplete="off"
                        required
                    >

                    <button type="submit">
                        Send
                    </button>

                </form>

            </div>

        </div>

    </main>

</div>


<script type="module" src="test-supabase.js"></script>
</body>
</html>
